[project]
name = "vault-rag"
version = "0.1.0"
description = "Search-and-answer over a Markdown notes vault, with a retrieval eval, a regression gate and a validated LLM judge"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "fastembed"]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
vault-rag = "vault_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vault_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads the real embedding model"]
